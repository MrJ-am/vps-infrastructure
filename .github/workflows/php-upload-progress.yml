name: Protéger PHP — progression des uploads
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Avis PHP du 23 octobre 2026, opération bornée
        type: choice
        options: [audit, apply]
        default: audit
permissions:
  contents: read
concurrency:
  group: vps-administration
  cancel-in-progress: false
jobs:
  proteger:
    if: github.ref == 'refs/heads/main' && github.actor == 'MrJ-am'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: vps-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Préparer le canal administratif existant
        env:
          SSH_KEY: ${{ secrets.VPS_ADMIN_SSH_KEY }}
        run: |
          set -eu
          test -n "$SSH_KEY"
          umask 077
          install -d -m 700 "$RUNNER_TEMP/php-upload-progress"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/php-upload-progress/admin"
          ssh-keygen -y -P '' -f "$RUNNER_TEMP/php-upload-progress/admin" >/dev/null
          printf 'VPS_SSH_KEY=%s\n' "$RUNNER_TEMP/php-upload-progress/admin" >> "$GITHUB_ENV"
      - name: Vérifier ou appliquer la protection déclarative
        env:
          UPLOAD_PROGRESS_OPERATION: ${{ inputs.operation }}
        run: python3 scripts/php-upload-progress-operation.py
      - name: Effacer la clé temporaire
        if: always()
        run: rm -f -- "$RUNNER_TEMP/php-upload-progress/admin"
