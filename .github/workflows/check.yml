name: Vérifier l'infrastructure sans déployer
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer Nix pour les contrôles locaux
        run: |
          sudo apt-get update
          sudo apt-get install -y nix-bin
      - name: Vérifier le registre et le routage
        run: sh scripts/check.sh
