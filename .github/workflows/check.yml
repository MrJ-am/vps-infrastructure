name: Vérifier l'infrastructure sans déployer
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer Nix pour les contrôles locaux
        run: |
          sudo apt-get update
          sudo apt-get install -y nix-bin
      - name: Vérifier le registre et le routage
        # Le paquet Ubuntu peut laisser le socket du démon Nix inaccessible
        # au compte runner. Ces contrôles n'ont besoin d'aucun démon.
        run: sudo env NIX_REMOTE=local sh scripts/check.sh
