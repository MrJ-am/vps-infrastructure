name: Construire l'identité commune sans l'activer
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: vps-administration
  cancel-in-progress: false
jobs:
  construire:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: vps-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Vérifier la CI du commit opérateur exact
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci-exacte.py
      - name: Préparer la connexion administrative existante
        id: connexion
        env:
          CLE: ${{ secrets.VPS_ADMIN_SSH_KEY }}
        run: |
          test -n "$CLE"
          umask 077
          printf '%s\n' "$CLE" > "$RUNNER_TEMP/vision-identite-admin"
          printf 'VPS_SSH_KEY=%s\n' "$RUNNER_TEMP/vision-identite-admin" >> "$GITHUB_ENV"
          ssh-keygen -y -P '' -f "$RUNNER_TEMP/vision-identite-admin" >/dev/null
      - name: Relever les autres sites avant construction
        id: releve
        run: python3 scripts/probe.py --output "$RUNNER_TEMP/http-before.json"
      - name: Construire le paquet exact sans démarrer le service
        run: |
          git archive --format=tar "$GITHUB_SHA" | sh scripts/connect.sh "umask 077; mkdir -p /root/vision-identite-operations/$GITHUB_SHA/source; tar -xf - -C /root/vision-identite-operations/$GITHUB_SHA/source"
          sh scripts/connect.sh "nix-shell -I nixpkgs=/nix/store/81s59zcy998ym4b36ayr29cjc9yhma5n-nixos-26.05.8639.c5c4a43b0e80/nixos -p python3 --run 'python3 /root/vision-identite-operations/$GITHUB_SHA/source/scripts/vision-identite-construire.py $GITHUB_SHA'"
      - name: Contrôler les services et une nouvelle connexion même après échec
        if: ${{ always() && steps.connexion.outcome == 'success' && steps.releve.outcome == 'success' }}
        run: sh scripts/connect.sh systemctl is-active sshd nginx postgresql vision matheval mrj-auth
      - name: Contrôler les autres sites même après échec
        if: ${{ always() && steps.releve.outcome == 'success' }}
        run: python3 scripts/probe.py --baseline "$RUNNER_TEMP/http-before.json"
      - name: Conserver seulement le rapport technique sans données
        run: |
          mkdir -p "$RUNNER_TEMP/rapport-identite"
          sh scripts/connect.sh "cat /root/vision-identite-operations/$GITHUB_SHA/construction.json" > "$RUNNER_TEMP/rapport-identite/construction.json"
      - uses: actions/upload-artifact@v4
        with:
          name: construction-identite-mrjam
          path: ${{ runner.temp }}/rapport-identite/
          retention-days: 14
          if-no-files-found: error
      - name: Effacer la clé du runner
        if: always()
        run: rm -f -- "$RUNNER_TEMP/vision-identite-admin"
