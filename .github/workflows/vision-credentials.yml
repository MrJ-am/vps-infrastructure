name: Renouveler les identifiants Vision
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vps-administration
  cancel-in-progress: false
jobs:
  rotate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: vps-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Vérifier les nouveaux secrets
        env:
          API_USERNAME: ${{ secrets.VISION_API_USERNAME }}
          API_PASSWORD: ${{ secrets.VISION_API_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os, re
          assert re.fullmatch(r'[A-Za-z0-9_.-]{1,64}', os.environ['API_USERNAME'])
          assert len(os.environ['API_PASSWORD']) >= 24
          PY
      - name: Préparer la clé administrative
        env:
          SSH_KEY: ${{ secrets.VPS_ADMIN_SSH_KEY }}
        run: |
          test -n "$SSH_KEY"
          umask 077
          VPS_SSH_KEY="$RUNNER_TEMP/vps-vision-admin"
          printf '%s\n' "$SSH_KEY" > "$VPS_SSH_KEY"
          printf 'VPS_SSH_KEY=%s\n' "$VPS_SSH_KEY" >> "$GITHUB_ENV"
          ssh-keygen -y -P '' -f "$VPS_SSH_KEY" >/dev/null
      - name: Installer l'outil temporaire de rotation
        run: sh scripts/connect.sh "install -m 0700 /dev/stdin /root/vision-credentials.py" < scripts/vision-credentials.py
      - name: Remplacer et vérifier les identifiants
        env:
          API_USERNAME: ${{ secrets.VISION_API_USERNAME }}
          API_PASSWORD: ${{ secrets.VISION_API_PASSWORD }}
        run: |
          python3 - <<'PY' | sh scripts/connect.sh "/run/current-system/sw/bin/nix-shell -p python3 --run 'python3 /root/vision-credentials.py'"
          import json, os, sys
          json.dump({'username': os.environ['API_USERNAME'], 'password': os.environ['API_PASSWORD']}, sys.stdout)
          PY
      - name: Effacer les fichiers temporaires
        if: always()
        run: |
          sh scripts/connect.sh "rm -f -- /root/vision-credentials.py" || true
          rm -f -- "$RUNNER_TEMP/vps-vision-admin"
