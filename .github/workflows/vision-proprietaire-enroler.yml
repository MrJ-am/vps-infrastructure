name: Vision — compte réservé du propriétaire
on:
  workflow_call:
    inputs:
      observer:
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  enroler:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment: vps-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - name: Vérifier de nouveau la demande et la CI exacte
        run: |
          python3 scripts/vision-demande-verifier.py
          python3 scripts/ci-exacte.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Préparer la connexion existante
        env:
          CLE: ${{ secrets.VPS_ADMIN_SSH_KEY }}
        run: |
          test -n "$CLE"
          umask 077
          printf '%s\n' "$CLE" > "$RUNNER_TEMP/vision-proprietaire-admin"
          printf 'VPS_SSH_KEY=%s\n' "$RUNNER_TEMP/vision-proprietaire-admin" >> "$GITHUB_ENV"
          ssh-keygen -y -P '' -f "$RUNNER_TEMP/vision-proprietaire-admin" >/dev/null
      - name: Relever les sites avant l’opération réservée
        id: sites
        run: python3 scripts/probe.py --output "$RUNNER_TEMP/http-before.json"
      - name: Vérifier HTTPS, issuer, refus et sources
        run: python3 scripts/identite-amorcage-https.py
      - name: Extraire le seul opérateur exact
        run: |
          git archive --format=tar "$GITHUB_SHA" | sh scripts/connect.sh "umask 077; mkdir -p /root/vision-proprietaire-operations/$GITHUB_SHA/source; tar --no-same-permissions -xf - -C /root/vision-proprietaire-operations/$GITHUB_SHA/source"
      - name: Créer uniquement le sujet initial et remettre son lien au relais
        if: ${{ !inputs.observer }}
        run: |
          sh scripts/connect.sh "nix-shell -I nixpkgs=/nix/store/81s59zcy998ym4b36ayr29cjc9yhma5n-nixos-26.05.8639.c5c4a43b0e80/nixos -p python3 --run 'python3 /root/vision-proprietaire-operations/$GITHUB_SHA/source/scripts/vision-proprietaire-enroler.py $GITHUB_SHA'"
      - name: Vérifier le mot de passe et le second facteur configurés
        if: ${{ inputs.observer }}
        run: |
          sh scripts/connect.sh "nix-shell -I nixpkgs=/nix/store/81s59zcy998ym4b36ayr29cjc9yhma5n-nixos-26.05.8639.c5c4a43b0e80/nixos -p python3 --run 'python3 /root/vision-proprietaire-operations/$GITHUB_SHA/source/scripts/vision-proprietaire-enroler.py $GITHUB_SHA --observer --activation-seule'"
      - name: Attendre au plus dix minutes la connexion réelle du propriétaire
        if: ${{ inputs.observer }}
        run: |
          sh scripts/connect.sh "nix-shell -I nixpkgs=/nix/store/81s59zcy998ym4b36ayr29cjc9yhma5n-nixos-26.05.8639.c5c4a43b0e80/nixos -p python3 --run 'python3 /root/vision-proprietaire-operations/$GITHUB_SHA/source/scripts/vision-proprietaire-enroler.py $GITHUB_SHA --observer --attendre-connexion'"
      - name: Vérifier une nouvelle connexion et les six services
        if: ${{ always() && steps.sites.outcome == 'success' }}
        run: sh scripts/connect.sh systemctl is-active sshd nginx postgresql vision matheval mrj-auth
      - name: Vérifier les 25 sites même après un refus
        if: ${{ always() && steps.sites.outcome == 'success' }}
        run: python3 scripts/probe.py --baseline "$RUNNER_TEMP/http-before.json"
      - name: Effacer la clé du runner
        if: always()
        run: rm -f -- "$RUNNER_TEMP/vision-proprietaire-admin"
