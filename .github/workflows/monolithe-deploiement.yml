name: Promotion du monolithe qualifié localement
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [preparer, restaurer, deployer, retour, diagnostic, confirmer-retour, audition-preparer, audition-deployer, audition-retour, audition-diagnostic, reconnexion-outillage]
        default: deployer
        description: Opération sur le candidat chiffré verrouillé dans main
permissions:
  contents: read
concurrency:
  group: vps-administration
  cancel-in-progress: false
jobs:
  promotion:
    if: github.ref == 'refs/heads/main' && github.actor == 'MrJ-am' && inputs.operation != 'reconnexion-outillage'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: vps-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Préparer la clé existante
        env:
          SSH_KEY: ${{ secrets.VPS_ADMIN_SSH_KEY }}
        run: |
          set -eu
          test -n "$SSH_KEY"
          umask 077
          install -d -m 700 "$RUNNER_TEMP/monolithe-ssh"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/monolithe-ssh/admin"
          ssh-keygen -y -P '' -f "$RUNNER_TEMP/monolithe-ssh/admin" >/dev/null
          printf 'VPS_SSH_KEY=%s\n' "$RUNNER_TEMP/monolithe-ssh/admin" >> "$GITHUB_ENV"
      - name: Recevoir et préparer le même artefact sans activation
        if: inputs.operation == 'preparer' || inputs.operation == 'deployer'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/monolithe-stage.py
      - name: Préconditions et activation ou retour
        if: inputs.operation != 'preparer'
        env:
          MRJAM_OPERATION: ${{ inputs.operation }}
        run: python3 scripts/monolithe-operation.py
      - name: Sonder les services existants
        run: python3 scripts/probe.py
      - name: Conserver le paquet officiel chiffré pour la qualification locale
        if: inputs.operation == 'reconnexion-outillage'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kanidm-reconnexion-chiffre
          path: ${{ runner.temp }}/kanidm-reconnexion.nar.age
          retention-days: 1
          if-no-files-found: error
      - name: Retirer la clé temporaire
        if: always()
        run: rm -f -- "$RUNNER_TEMP/monolithe-ssh/admin"
  outillage-reconnexion:
    if: github.ref == 'refs/heads/main' && github.actor == 'MrJ-am' && inputs.operation == 'reconnexion-outillage'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: vps-production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Préparer la clé administrative existante
        env:
          SSH_KEY: ${{ secrets.VPS_ADMIN_SSH_KEY }}
        run: |
          set -eu
          test -n "$SSH_KEY"
          umask 077
          install -d -m 700 "$RUNNER_TEMP/monolithe-ssh"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/monolithe-ssh/admin"
          ssh-keygen -y -P '' -f "$RUNNER_TEMP/monolithe-ssh/admin" >/dev/null
          printf 'VPS_SSH_KEY=%s\n' "$RUNNER_TEMP/monolithe-ssh/admin" >> "$GITHUB_ENV"
      - name: Recevoir et publier uniquement le paquet officiel chiffré
        env:
          GH_TOKEN: ${{ github.token }}
          MRJAM_TRANSPORT_OUTILLAGE: git-chiffre
        run: python3 scripts/mcp-reconnexion-outillage.py
      - name: Retirer la clé temporaire
        if: always()
        run: rm -f -- "$RUNNER_TEMP/monolithe-ssh/admin"
