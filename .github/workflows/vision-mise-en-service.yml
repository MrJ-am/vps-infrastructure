name: Vision — mise en service suivie
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Vision — demande d'opération"]
    types: [completed]
    branches: [operations/vision]
permissions:
  contents: read
  actions: read
concurrency:
  group: vps-administration
  cancel-in-progress: false
jobs:
  demande:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      action: ${{ steps.plan.outputs.action }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - name: Vérifier la demande dédiée et le main exact avant tout accès VPS
        run: python3 scripts/vision-demande-verifier.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Exiger la réussite de la CI de ce même commit
        run: python3 scripts/ci-exacte.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Choisir la phase qualifiée dans le plan du main
        id: plan
        run: python3 scripts/vision-plan.py
  amorcage:
    needs: demande
    if: needs.demande.outputs.action == 'amorcage'
    uses: ./.github/workflows/vision-identite-amorcage-activer.yml
    secrets: inherit
  diagnostic:
    needs: demande
    if: needs.demande.outputs.action == 'diagnostic'
    uses: ./.github/workflows/vision-identite-amorcage-auditer.yml
    secrets: inherit
  construction:
    needs: demande
    if: needs.demande.outputs.action == 'construction'
    uses: ./.github/workflows/vision-identite-amorcage-preparer.yml
    secrets: inherit
  proprietaire:
    needs: demande
    if: needs.demande.outputs.action == 'proprietaire'
    uses: ./.github/workflows/vision-proprietaire-enroler.yml
    secrets: inherit
  proprietaire-observer:
    needs: demande
    if: needs.demande.outputs.action == 'proprietaire-observer'
    uses: ./.github/workflows/vision-proprietaire-enroler.yml
    with:
      observer: true
    secrets: inherit
  vision-preparer:
    needs: demande
    if: needs.demande.outputs.action == 'vision-preparer'
    uses: ./.github/workflows/vision-bascule-preparer.yml
    secrets: inherit
  vision-diagnostic:
    needs: demande
    if: needs.demande.outputs.action == 'vision-diagnostic'
    uses: ./.github/workflows/vision-bascule-diagnostiquer.yml
    secrets: inherit
  vision-telephone:
    needs: demande
    if: needs.demande.outputs.action == 'vision-telephone'
    uses: ./.github/workflows/vision-telephone.yml
    secrets: inherit
  vision-sauvegarder:
    needs: demande
    if: needs.demande.outputs.action == 'vision-sauvegarder'
    uses: ./.github/workflows/vision-bascule-preparer.yml
    with:
      sauvegarde-telephone: true
    secrets: inherit
  vision-essai-preparer:
    needs: demande
    if: needs.demande.outputs.action == 'vision-essai-preparer'
    uses: ./.github/workflows/vision-bascule-preparer.yml
    with:
      preparer-essai: true
    secrets: inherit
  vision-essai-diagnostic:
    needs: demande
    if: needs.demande.outputs.action == 'vision-essai-diagnostic'
    uses: ./.github/workflows/vision-bascule-diagnostiquer.yml
    with:
      essai: true
    secrets: inherit
  vision-retour-qualifier:
    needs: demande
    if: needs.demande.outputs.action == 'vision-retour-qualifier'
    uses: ./.github/workflows/vision-retour-qualifier.yml
    secrets: inherit
  vision-reprise-qualifier:
    needs: demande
    if: needs.demande.outputs.action == 'vision-reprise-qualifier'
    uses: ./.github/workflows/vision-retour-qualifier.yml
    with:
      reprise: true
    secrets: inherit
