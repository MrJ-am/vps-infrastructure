name: Préparer l’interface Vision depuis son artefact vérifié
on:
  push:
    branches: [main]
    paths: [operations/vision-static.json]
permissions:
  contents: read
  actions: read
concurrency:
  group: vps-administration
  cancel-in-progress: false
jobs:
  publication:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: vps-production
    steps:
      - uses: actions/checkout@v4
      - name: Lire la demande
        id: demande
        run: |
          python3 - <<'PY'
          import json,os,re
          d=json.load(open('operations/vision-static.json'))
          assert d['operation'] in ('preparer','activer')
          assert re.fullmatch('[0-9a-f]{40}',d['revision'])
          assert isinstance(d['run'],int) and isinstance(d['artifact'],int)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              for k,v in d.items(): f.write(f'{k}={v}\n')
          PY
      - name: Extraire l’artefact vérifié et conservé
        run: unzip -q vendor/vision-static.zip -d artefact
      - name: Vérifier le manifeste du candidat
        env:
          REVISION: ${{ steps.demande.outputs.revision }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          p=pathlib.Path('artefact');m=json.loads((p/'manifest.json').read_text())
          assert m['revisionApplication']==os.environ['REVISION']
          assert {str(x.relative_to(p)) for x in p.rglob('*') if x.is_file()}==set(m['fichiers'])|{'manifest.json'}
          for nom,digest in m['fichiers'].items():
              assert hashlib.sha256((p/nom).read_bytes()).hexdigest()==digest,nom
          print('Artefact exact et révision vérifiés.')
          PY
      - name: Installer la clé existante du runner
        env:
          SSH_KEY: ${{ secrets.VPS_ADMIN_SSH_KEY }}
        run: |
          test -n "$SSH_KEY"
          umask 077
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/vision-static-cle"
          ssh-keygen -y -P '' -f "$RUNNER_TEMP/vision-static-cle" >/dev/null
          printf 'VPS_SSH_KEY=%s\n' "$RUNNER_TEMP/vision-static-cle" >> "$GITHUB_ENV"
      - name: Préparer les fichiers statiques sans bascule
        if: steps.demande.outputs.operation == 'preparer'
        env:
          REVISION: ${{ steps.demande.outputs.revision }}
        run: python3 scripts/vision-static-deployer.py preparer "$REVISION"
      - name: Installer le navigateur
        if: steps.demande.outputs.operation == 'activer'
        run: |
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
      - name: Activer sous retour autonome
        if: steps.demande.outputs.operation == 'activer'
        env:
          REVISION: ${{ steps.demande.outputs.revision }}
        run: python3 scripts/vision-static-deployer.py activer "$REVISION"
      - name: Contrôler l’interface servie, le menu et la session
        if: steps.demande.outputs.operation == 'activer'
        env:
          VISION_INTERFACE_ARTEFACT: artefact
          VISION_API_USERNAME: ${{ secrets.VISION_API_USERNAME }}
          VISION_API_PASSWORD: ${{ secrets.VISION_API_PASSWORD }}
        run: python3 scripts/vision-interface-verifier.py
      - name: Enregistrer la publication
        if: steps.demande.outputs.operation == 'activer'
        env:
          REVISION: ${{ steps.demande.outputs.revision }}
        run: python3 scripts/vision-static-deployer.py finaliser "$REVISION"
      - name: Retour immédiat en cas d’échec
        if: failure() && steps.demande.outputs.operation == 'activer'
        env:
          REVISION: ${{ steps.demande.outputs.revision }}
        run: python3 scripts/vision-static-deployer.py retour "$REVISION"
      - name: Effacer la clé du runner
        if: always()
        run: rm -f -- "$RUNNER_TEMP/vision-static-cle"
