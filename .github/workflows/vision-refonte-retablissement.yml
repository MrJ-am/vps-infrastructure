name: Rétablir le service Vision après migration
on:
  push:
    branches: [main]
    paths: [.github/workflows/vision-refonte-retablissement.yml]
permissions:
  contents: read
jobs:
  retablir:
    runs-on: ubuntu-latest
    environment: vps-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Préparer la clé
        env:
          SSH_KEY: ${{ secrets.VPS_ADMIN_SSH_KEY }}
        run: |
          test -n "$SSH_KEY"
          umask 077
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/vision-retablissement-cle"
          ssh-keygen -y -P '' -f "$RUNNER_TEMP/vision-retablissement-cle" >/dev/null
          printf 'VPS_SSH_KEY=%s\n' "$RUNNER_TEMP/vision-retablissement-cle" >> "$GITHUB_ENV"
      - name: Rétablir le titre interne compatible et démarrer Vision
        run: |
          NIXPKGS_RETABLISSEMENT=$(sh scripts/connect.sh 'nix-instantiate --find-file nixpkgs')
          sh scripts/connect.sh "/run/current-system/sw/bin/nix-shell -I nixpkgs=$NIXPKGS_RETABLISSEMENT -p python3 postgresql_17 --run 'python3 -'" <<'PY'
          import subprocess
          sql="""SET ROLE vision;
          UPDATE vision_items i SET titre='TSD — '||left(i.contenu,194)
          FROM vision_liens l JOIN vision_fiches f
            ON f.utilisateur=l.utilisateur AND f.id=l.fiche_id
          WHERE l.utilisateur=i.utilisateur AND l.item_id=i.id
            AND f.titre='TSD — Théorie des situations didactiques'
            AND i.titre NOT LIKE 'TSD — %';"""
          subprocess.run(['runuser','-u','postgres','--','psql','-Xq','-v','ON_ERROR_STOP=1','-h','/run/postgresql','-d','vision','-c',sql],check=True,stdout=subprocess.DEVNULL)
          subprocess.run(['systemctl','reset-failed','vision-migrate.service'],check=True)
          subprocess.run(['systemctl','start','vision.service'],check=True)
          subprocess.run(['systemctl','is-active','--quiet','vision.service'],check=True)
          subprocess.run(['systemctl','stop','vision-refonte-retour-e42476ff7b5c.timer'],check=True)
          print('Vision rétabli ; contenu et séances conservés.')
          PY
      - name: Effacer la clé
        if: always()
        run: rm -f -- "$RUNNER_TEMP/vision-retablissement-cle"
