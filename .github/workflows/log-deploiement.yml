name: Promotion Log Kanidm qualifié localement
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [preparer, deployer, courriel, retour, diagnostic, retrouver-identite, renommer-identite, corriger-connexion, restaurer-clients-mcp, interface, interface-retour]
        default: interface
        description: Opération fermée sur le candidat Log scellé dans main
      destinataire_identite:
        type: string
        default: ''
        description: Clé publique RSA 4096 PEM en base64 pour le relevé privé en lecture seule
      nouvel_identifiant:
        type: string
        default: ''
        description: Nouveau nom natif du compte Log existant, sans alias
permissions:
  contents: read
concurrency:
  group: vps-administration
  cancel-in-progress: false
jobs:
  promotion:
    if: github.ref == 'refs/heads/main' && github.actor == 'MrJ-am'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: vps-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          # Le descripteur suit le commit des sources qualifiées. Vérifier
          # ce parent exact sans récupérer les branches d'artefacts chiffrés.
          fetch-depth: 2
      - name: Préparer la clé administrative existante
        env:
          SSH_KEY: ${{ secrets.VPS_ADMIN_SSH_KEY }}
        run: |
          set -eu
          test -n "$SSH_KEY"
          umask 077
          install -d -m 700 "$RUNNER_TEMP/log-ssh"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/log-ssh/admin"
          ssh-keygen -y -P '' -f "$RUNNER_TEMP/log-ssh/admin" >/dev/null
          printf 'VPS_SSH_KEY=%s\n' "$RUNNER_TEMP/log-ssh/admin" >> "$GITHUB_ENV"
      - name: Recevoir, vérifier et promouvoir le même candidat
        env:
          GH_TOKEN: ${{ github.token }}
          MRJAM_OPERATION: ${{ inputs.operation }}
          MRJAM_IDENTITE_DESTINATAIRE: ${{ inputs.destinataire_identite }}
        run: python3 scripts/log-operation.py
      - name: Effacer la clé temporaire
        if: always()
        run: rm -f -- "$RUNNER_TEMP/log-ssh/admin"
