name: Vision — qualification du retour sans activation
on:
  workflow_call:
    inputs:
      reprise:
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  qualifier:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: vps-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - name: Vérifier la demande et les quatre validations du commit exact
        run: |
          python3 scripts/vision-demande-verifier.py
          python3 scripts/ci-exacte.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Préparer la connexion existante
        env:
          CLE: ${{ secrets.VPS_ADMIN_SSH_KEY }}
        run: |
          test -n "$CLE"
          umask 077
          printf '%s\n' "$CLE" > "$RUNNER_TEMP/vision-retour-admin"
          printf 'VPS_SSH_KEY=%s\n' "$RUNNER_TEMP/vision-retour-admin" >> "$GITHUB_ENV"
          ssh-keygen -y -P '' -f "$RUNNER_TEMP/vision-retour-admin" >/dev/null
      - name: Relever les 25 sites et vérifier l'identité avant qualification
        id: sites
        run: |
          python3 scripts/probe.py --output "$RUNNER_TEMP/http-before.json"
          python3 scripts/identite-amorcage-https.py
      - name: Extraire le seul opérateur exact puis qualifier une unité jetable
        run: |
          git archive --format=tar "$GITHUB_SHA" | sh scripts/connect.sh "umask 077; mkdir -p /root/vision-retour-qualifications/$GITHUB_SHA/source; tar --no-same-permissions -xf - -C /root/vision-retour-qualifications/$GITHUB_SHA/source"
      - name: Qualifier les conditions natives sans reprise
        if: ${{ !inputs.reprise }}
        run: |
          sh scripts/connect.sh "nix-shell -I nixpkgs=/nix/store/81s59zcy998ym4b36ayr29cjc9yhma5n-nixos-26.05.8639.c5c4a43b0e80/nixos -p python3 --run 'python3 /root/vision-retour-qualifications/$GITHUB_SHA/source/scripts/vision-retour-qualifier.py $GITHUB_SHA'"
      - name: Répéter la reprise et l'ordre de fermeture sur deux unités jetables
        if: ${{ inputs.reprise }}
        run: |
          sh scripts/connect.sh "nix-shell -I nixpkgs=/nix/store/81s59zcy998ym4b36ayr29cjc9yhma5n-nixos-26.05.8639.c5c4a43b0e80/nixos -p python3 --run 'python3 /root/vision-retour-qualifications/$GITHUB_SHA/source/scripts/vision-retour-qualifier.py $GITHUB_SHA --reprise'"
      - name: Vérifier une nouvelle connexion et les six services
        if: ${{ always() && steps.sites.outcome == 'success' }}
        run: sh scripts/connect.sh systemctl is-active sshd nginx postgresql vision matheval mrj-auth
      - name: Vérifier les 25 sites même après un refus
        if: ${{ always() && steps.sites.outcome == 'success' }}
        run: python3 scripts/probe.py --baseline "$RUNNER_TEMP/http-before.json"
      - name: Effacer la clé du runner
        if: always()
        run: rm -f -- "$RUNNER_TEMP/vision-retour-admin"
