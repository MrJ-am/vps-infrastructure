name: Publier et vérifier l’interface Vision
on:
  push:
    branches: [main]
    paths: ['operations/vision-interface.json']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: vps-administration
  cancel-in-progress: false
jobs:
  interface:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: vps-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Vérifier la demande et la CI de la révision exacte
        id: demande
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          d = json.load(open('operations/vision-interface.json'))
          assert d['operation'] in ('preparer', 'controler', 'activer')
          assert re.fullmatch('[0-9a-f]{40}', d['revision'])
          url = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/actions/workflows/check.yml/runs?head_sha=' + d['revision']
          req = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(req) as r: runs = json.load(r)['workflow_runs']
          assert any(r['head_sha'] == d['revision'] and r['conclusion'] == 'success' for r in runs), 'CI de la révision non validée'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('revision=' + d['revision'] + '\noperation=' + d['operation'] + '\n')
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.demande.outputs.revision }}
          path: candidat
          persist-credentials: false
      - name: Préparer les outils et la clé administrative existante
        env:
          SSH_KEY: ${{ secrets.VPS_ADMIN_SSH_KEY }}
        run: |
          test -n "$SSH_KEY"
          umask 077
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/vision-interface-cle"
          ssh-keygen -y -P '' -f "$RUNNER_TEMP/vision-interface-cle" >/dev/null
          printf 'VPS_SSH_KEY=%s\n' "$RUNNER_TEMP/vision-interface-cle" >> "$GITHUB_ENV"
      - name: Installer le navigateur de contrôle
        if: steps.demande.outputs.operation == 'activer'
        run: |
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
      - name: Préparer les sources, l’artefact et le candidat système
        if: steps.demande.outputs.operation == 'preparer'
        working-directory: candidat
        env:
          REVISION: ${{ steps.demande.outputs.revision }}
        run: |
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/vision-interface-source.tar.gz"
          sh scripts/connect.sh "umask 077; mkdir -p /root/vision-interface-operations/$REVISION/source; tar -xzf - -C /root/vision-interface-operations/$REVISION/source" < "$RUNNER_TEMP/vision-interface-source.tar.gz"
          sh scripts/connect.sh "/run/current-system/sw/bin/nix-shell -p python3 --run 'python3 /root/vision-interface-operations/$REVISION/source/scripts/vision-interface-deployer.py preparer $REVISION'"
      - name: Lire la simulation complète du candidat déjà construit
        if: steps.demande.outputs.operation == 'controler'
        working-directory: candidat
        env:
          REVISION: ${{ steps.demande.outputs.revision }}
        run: |
          set -euo pipefail
          mkdir -p rapports-vision
          sh scripts/connect.sh "/root/vision-interface-operations/$REVISION/result/bin/switch-to-configuration dry-activate 2>&1" | tee rapports-vision/simulation-complete.txt
      - name: Activer l’interface avec retour autonome
        if: steps.demande.outputs.operation == 'activer'
        working-directory: candidat
        env:
          REVISION: ${{ steps.demande.outputs.revision }}
        run: |
          sh scripts/connect.sh "/run/current-system/sw/bin/nix-shell -p python3 --run 'python3 /root/vision-interface-operations/$REVISION/source/scripts/vision-interface-deployer.py demarrer $REVISION'"
      - name: Contrôler les sites et une nouvelle connexion indépendante
        working-directory: candidat
        env:
          REVISION: ${{ steps.demande.outputs.revision }}
        run: |
          sh scripts/connect.sh "systemctl is-active sshd nginx postgresql matheval vision mrj-auth"
          sh scripts/connect.sh "cat /root/vision-interface-operations/$REVISION/registre.json" > "$RUNNER_TEMP/vision-registre.json"
          sh scripts/connect.sh "cat /root/vision-interface-operations/$REVISION/http-avant.json" > "$RUNNER_TEMP/vision-http-avant.json"
          python3 scripts/probe.py --registry "$RUNNER_TEMP/vision-registre.json" --baseline "$RUNNER_TEMP/vision-http-avant.json"
      - name: Vérifier le navigateur, le manifeste et l’authentification réelle
        if: steps.demande.outputs.operation == 'activer'
        working-directory: candidat
        env:
          VISION_API_USERNAME: ${{ secrets.VISION_API_USERNAME }}
          VISION_API_PASSWORD: ${{ secrets.VISION_API_PASSWORD }}
        run: python3 scripts/vision-interface-verifier.py
      - name: Enregistrer exactement la génération contrôlée
        if: steps.demande.outputs.operation == 'activer'
        working-directory: candidat
        env:
          REVISION: ${{ steps.demande.outputs.revision }}
        run: |
          sh scripts/connect.sh "/run/current-system/sw/bin/nix-shell -p python3 --run 'python3 /root/vision-interface-operations/$REVISION/source/scripts/vision-interface-deployer.py finaliser $REVISION'"
      - name: Conserver les preuves sans données privées
        working-directory: candidat
        env:
          REVISION: ${{ steps.demande.outputs.revision }}
          OPERATION: ${{ steps.demande.outputs.operation }}
        run: |
          mkdir -p rapports-vision
          sh scripts/connect.sh "cat /root/vision-interface-operations/$REVISION/prepare.json" > rapports-vision/prepare.json
          sh scripts/connect.sh "cat /root/vision-interface-operations/$REVISION/simulation.txt" > rapports-vision/simulation.txt
          if [ "$OPERATION" = activer ]; then
            sh scripts/connect.sh "cat /root/vision-interface-operations/$REVISION/termine.json" > rapports-vision/termine.json
          fi
      - name: Revenir immédiatement en cas d’échec de la bascule
        if: failure() && steps.demande.outputs.operation == 'activer'
        working-directory: candidat
        env:
          REVISION: ${{ steps.demande.outputs.revision }}
        run: |
          sh scripts/connect.sh "/run/current-system/sw/bin/nix-shell -p python3 --run 'python3 /root/vision-interface-operations/$REVISION/source/scripts/vision-interface-deployer.py retour $REVISION'"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vision-interface-${{ steps.demande.outputs.operation }}
          path: candidat/rapports-vision
          retention-days: 30
          if-no-files-found: warn
      - name: Effacer la clé temporaire
        if: always()
        run: rm -f -- "$RUNNER_TEMP/vision-interface-cle"
