name: Diagnostiquer l'essai Vision échoué
on:
  push:
    branches: [main]
    paths: [.github/workflows/vision-refonte-diagnostic.yml]
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    environment: vps-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Préparer la clé
        env:
          SSH_KEY: ${{ secrets.VPS_ADMIN_SSH_KEY }}
        run: |
          test -n "$SSH_KEY"
          umask 077
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/vision-diagnostic-cle"
          ssh-keygen -y -P '' -f "$RUNNER_TEMP/vision-diagnostic-cle" >/dev/null
          printf 'VPS_SSH_KEY=%s\n' "$RUNNER_TEMP/vision-diagnostic-cle" >> "$GITHUB_ENV"
      - name: Compter les observations et doublons sans contenu privé
        run: |
          NIXPKGS_DIAGNOSTIC=$(sh scripts/connect.sh 'nix-instantiate --find-file nixpkgs')
          sh scripts/connect.sh "/run/current-system/sw/bin/nix-shell -I nixpkgs=$NIXPKGS_DIAGNOSTIC -p python3 --run 'python3 -'" <<'PY'
          import json, subprocess
          sql="""SELECT jsonb_build_object(
            'total',(SELECT count(*) FROM vision_observations),
            'sources',(SELECT jsonb_object_agg(source,n) FROM
              (SELECT source,count(*) n FROM vision_observations GROUP BY source) s),
            'doublons',(SELECT coalesce(sum(n-1),0) FROM
              (SELECT count(*) n FROM vision_observations
                GROUP BY utilisateur,item_id,fiche_id,texte,source,evenement_a
                HAVING count(*)>1) d)
          );"""
          p=subprocess.run(['runuser','-u','postgres','--','psql','-XAtq','-h','/run/postgresql','-d','vision','-c',sql],check=True,capture_output=True,text=True)
          print(p.stdout.strip())
          PY
      - name: Effacer la clé
        if: always()
        run: rm -f -- "$RUNNER_TEMP/vision-diagnostic-cle"
