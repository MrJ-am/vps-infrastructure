name: Auditer le VPS
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [operations/audit-request.json]
permissions:
  contents: read
concurrency:
  group: vps-administration
  cancel-in-progress: false
jobs:
  audit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: vps-production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Vérifier la demande de diagnostic
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          request = json.loads(Path('operations/audit-request.json').read_text())
          assert set(request) == {'id', 'operation'}, 'Champs de demande inattendus'
          assert request['operation'] == 'audit', 'Seul le diagnostic est autorisé ici'
          assert isinstance(request['id'], str) and re.fullmatch(r'[a-z0-9-]{1,80}', request['id']), 'Identifiant invalide'
          print('Demande de diagnostic :', request['id'])
          PY
      - name: Préparer la clé administrative
        id: ssh
        env:
          SSH_KEY: ${{ secrets.VPS_ADMIN_SSH_KEY }}
        run: |
          VPS_SSH_KEY="$RUNNER_TEMP/vps-audit-ssh/admin"
          printf 'VPS_SSH_KEY=%s\n' "$VPS_SSH_KEY" >> "$GITHUB_ENV"
          if [ -z "$SSH_KEY" ]; then
            echo '::error::Secret VPS_ADMIN_SSH_KEY absent ; voir docs/ACCES.md.'
            exit 1
          fi
          umask 077
          install -d -m 700 "$(dirname -- "$VPS_SSH_KEY")"
          printf '%s\n' "$SSH_KEY" > "$VPS_SSH_KEY"
          ssh-keygen -y -P '' -f "$VPS_SSH_KEY" >/dev/null
      - name: Relever la génération actuelle et les ressources sans mutation
        run: |
          sh scripts/connect.sh sh -s <<'SH'
          set -eu
          readlink -f /run/current-system
          readlink -f /nix/var/nix/profiles/system
          cat /etc/nixos/configuration.nix
          nix-instantiate --find-file nixpkgs
          free -m
          df -Pk /
          for application in vision vision-interface matheval logique; do readlink -f "/srv/$application/current"; done
          systemctl list-timers --all --no-pager | rg 'retour|rollback|backup' || true
          runuser -u postgres -- psql -XAtq vision -c "SELECT name,default_version,installed_version FROM pg_available_extensions WHERE name IN ('vector','pg_trgm'); SELECT count(*) FROM vision_items;"
          SH
      - name: Lire l'état du système et des services
        if: ${{ !cancelled() && steps.ssh.outcome == 'success' }}
        run: sh scripts/connect.sh sh -s < scripts/audit.sh
      - name: Lire les bases et les droits PostgreSQL
        if: ${{ !cancelled() && steps.ssh.outcome == 'success' }}
        run: sh scripts/connect.sh sh -s < scripts/audit-postgresql.sh
      - name: Vérifier les points d'accès publics
        if: ${{ !cancelled() && steps.ssh.outcome == 'success' }}
        run: python3 scripts/probe.py
      - name: Effacer la clé temporaire du runner
        if: always()
        run: rm -f -- "$RUNNER_TEMP/vps-audit-ssh/admin"
