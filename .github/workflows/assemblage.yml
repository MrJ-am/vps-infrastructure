name: Qualifier l’assemblage central
on:
  push:
    paths:
      - assemblage/**
      - mrjam-metier.asd
      - mrjam-native.asd
      - mrjam-courriel.asd
      - mrjam-identite.asd
      - lisp/**
      - scripts/assemblage.py
      - scripts/ci-impact.py
      - scripts/coordination.py
      - scripts/qualifier-metier.py
      - scripts/construire-metier-nix.py
      - scripts/monolithe-stage.py
      - scripts/monolithe-preparer.py
      - scripts/monolithe-config.nix
      - scripts/monolithe-evaluation.nix
      - scripts/verifier-dependances.py
      - tests/test_assemblage.py
      - tests/test_assemblage_revisions.py
      - tests/matheval-differentiel.*
      - tests/matheval-composant.*
      - tests/native-differentiel.*
      - tests/serveur-artefact.py
      - tests/vision-sql-native.*
      - tests/vision-cycle.lisp
      - tests/gestion-differentiel.*
      - tests/courriel-*
      - tests/identite-client.py
      - tests/admission*
      - tests/fermeture-composant.lisp
      - tests/vision-http-commun.py
      - scripts/frontends.py
      - scripts/outiller.py
      - scripts/ci-qualifier.py
      - scripts/modele-vision.py
      - scripts/provenance-outils.py
      - scripts/verifier-ci.py
      - scripts/verifier-tables.py
      - scripts/vision-contrats.py
      - tests/cache-fasl.py
      - tests/http_fixture.py
      - tests/matheval-navigateur.py
      - tests/vision-reference.py
      - tests/vision-documents-commun.py
      - tests/matheval-reference.py
      - tests/json-commun.lisp
      - tests/quotas-http.lisp
      - tests/cache-documents.py
      - tests/test_tables_privees.py
      - tests/test_monolithe_sauvegarde.py
      - scripts/monolithe-sauvegarde.py
      - .github/workflows/assemblage.yml
  workflow_dispatch:
    inputs:
      preparer_vps:
        type: boolean
        default: false
        description: Après campagne de référence, transférer le même candidat et préparer le système sans activation
permissions:
  contents: read
concurrency:
  group: assemblage-${{ github.ref }}
  cancel-in-progress: false
jobs:
  cadre:
    runs-on: ubuntu-latest
    outputs:
      composants: ${{ steps.impact.outputs.composants }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Sélectionner le travail réellement concerné
        id: impact
        env:
          MRJAM_COMMIT_AVANT: ${{ github.event.before }}
        run: python3 scripts/ci-impact.py
      - name: Vérifier le contrat et l’archive historique
        run: python3 scripts/coordination.py verifier
      - name: Vérifier le sélecteur et les reçus affectés
        if: steps.impact.outputs.test_selection == 'true'
        run: python3 -m unittest discover -s tests -p 'test_assemblage*.py'
      - name: Vérifier les copies de sauvegarde affectées
        if: steps.impact.outputs.test_sauvegarde == 'true'
        run: python3 -m unittest discover -s tests -p test_monolithe_sauvegarde.py
      - name: Vérifier le garde-fou SQL affecté
        if: steps.impact.outputs.test_schema == 'true'
        run: python3 -m unittest discover -s tests -p test_tables_privees.py
  composants:
    needs: cadre
    if: needs.cadre.outputs.composants == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: vps-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Exiger l’accès de lecture aux deux sources privées
        env:
          COMPONENTS_READ_TOKEN: ${{ secrets.COMPONENTS_READ_TOKEN }}
        run: |
          if [ -z "$COMPONENTS_READ_TOKEN" ]; then
            printf '%s\n' '::error::COMPONENTS_READ_TOKEN absent : la CI ne lit pas Vision/Signature privés. Aucun candidat ne peut être publié.'
            exit 2
          fi
      - name: Lire exclusivement les six révisions autorisées
        id: sources
        run: |
          PYTHONPATH=scripts python3 - <<'PY'
          import os
          from assemblage import manifeste
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              for nom,source in manifeste()['sources'].items():
                  if nom!='vps': f.write(nom+'='+source['revision']+'\n')
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: MrJ-am/vision
          ref: ${{ steps.sources.outputs.vision }}
          path: .sources/vision
          fetch-depth: 0
          token: ${{ secrets.COMPONENTS_READ_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: MrJ-am/M-moire
          ref: ${{ steps.sources.outputs.matheval }}
          path: .sources/M-moire
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: MrJ-am/apprendre-a-demontrer
          ref: ${{ steps.sources.outputs.logique }}
          path: .sources/apprendre-a-demontrer
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: MrJ-am/style-mrjam
          ref: ${{ steps.sources.outputs.style }}
          path: .sources/style-mrjam
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: MrJ-am/Signature
          ref: ${{ steps.sources.outputs.signature }}
          path: .sources/Signature
          fetch-depth: 0
          token: ${{ secrets.COMPONENTS_READ_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          # Même V8 que l'ancien atelier Style et la qualification locale.
          # Node sert uniquement aux constructions/tests et à la référence.
          node-version: '24.19.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Vérifier toutes les dépendances directes et leurs locks
        env:
          MRJAM_ATELIER: ${{ github.workspace }}/.sources/
        run: |
          python3 scripts/verifier-dependances.py
          python3 scripts/verifier-ci.py
      - name: Sélectionner le compilateur et le candidat Nix nécessaires
        id: besoin_nix
        env:
          MRJAM_ATELIER: ${{ github.workspace }}/.sources/
          MRJAM_COMMIT_AVANT: ${{ github.event.before }}
        run: |
          PYTHONPATH=scripts python3 - <<'PY'
          import os
          from assemblage import catalogue,selection,changements_assemblage,chemins_sources
          suites=catalogue()
          noms=selection(changements_assemblage(os.environ.get('MRJAM_COMMIT_AVANT'),chemins_sources(atelier=os.environ['MRJAM_ATELIER'])),suites)
          metier=any(suites[n].get('candidat_metier') or n=='matheval-postgresql' for n in noms)
          sbcl=metier or any('sbcl' in suites[n].get('outils',{}) for n in noms)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              outils=sbcl or 'matheval-interface' in noms
              f.write('sbcl='+str(sbcl).lower()+'\noutils='+str(outils).lower()+'\nmetier='+str(metier).lower()+'\n')
          PY
      - name: Fournir Nix par le même mécanisme que les tests infrastructure existants
        if: steps.besoin_nix.outputs.outils == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y nix-bin
      - name: Construire une fois avec SBCL 2.6.4 et le Nixpkgs exact du VPS
        if: steps.besoin_nix.outputs.outils == 'true'
        env:
          MRJAM_ATELIER: ${{ github.workspace }}/.sources/
          BESOIN_METIER: ${{ steps.besoin_nix.outputs.metier }}
        run: |
          if [ "$BESOIN_METIER" = true ]; then
            python3 scripts/construire-metier-nix.py
          else
            python3 scripts/construire-metier-nix.py --outils-seulement
          fi
      - name: Qualifier les sources exactes et les contrats différentiels
        env:
          MRJAM_ATELIER: ${{ github.workspace }}/.sources/
          MRJAM_COMMIT_AVANT: ${{ github.event.before }}
        run: |
          python3 scripts/assemblage.py verifier --atelier "$MRJAM_ATELIER" --exact
          python3 scripts/ci-qualifier.py
      - name: Préparer la clé administrative existante pour le transfert privé
        if: inputs.preparer_vps == true && github.ref == 'refs/heads/main'
        env:
          SSH_KEY: ${{ secrets.VPS_ADMIN_SSH_KEY }}
        run: |
          set -eu
          test -n "$SSH_KEY"
          umask 077
          install -d -m 700 "$RUNNER_TEMP/monolithe-ssh"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/monolithe-ssh/admin"
          ssh-keygen -y -P '' -f "$RUNNER_TEMP/monolithe-ssh/admin" >/dev/null
          printf 'VPS_SSH_KEY=%s\n' "$RUNNER_TEMP/monolithe-ssh/admin" >> "$GITHUB_ENV"
      - name: Transférer le même artefact qualifié et préparer sans activer
        if: inputs.preparer_vps == true && github.ref == 'refs/heads/main'
        env:
          MRJAM_ATELIER: ${{ github.workspace }}/.sources/
        run: python3 scripts/monolithe-stage.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recus-${{ github.sha }}
          path: state/recus/*.json
          retention-days: 14
          if-no-files-found: ignore
      - name: Retirer la clé temporaire
        if: always() && inputs.preparer_vps == true
        run: rm -f -- "$RUNNER_TEMP/monolithe-ssh/admin"
