name: Vision — réparation de référence et préparation isolée
on:
  workflow_call:
    inputs:
      sauvegarde-telephone:
        type: boolean
        default: false
      preparer-essai:
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  preparer:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: vps-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - name: Vérifier la demande et la CI exacte avant tout credential VPS
        run: |
          python3 scripts/vision-demande-verifier.py
          python3 scripts/ci-exacte.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Préparer la connexion existante
        env:
          CLE: ${{ secrets.VPS_ADMIN_SSH_KEY }}
        run: |
          test -n "$CLE"
          umask 077
          printf '%s\n' "$CLE" > "$RUNNER_TEMP/vision-bascule-admin"
          printf 'VPS_SSH_KEY=%s\n' "$RUNNER_TEMP/vision-bascule-admin" >> "$GITHUB_ENV"
          ssh-keygen -y -P '' -f "$RUNNER_TEMP/vision-bascule-admin" >/dev/null
      - name: Relever les 25 sites avant préparation
        id: sites
        run: python3 scripts/probe.py --output "$RUNNER_TEMP/http-before.json"
      - name: Vérifier l’identité HTTPS et les routes refusées
        run: python3 scripts/identite-amorcage-https.py
      - name: Extraire le seul opérateur exact dans un dossier privé
        run: |
          git archive --format=tar "$GITHUB_SHA" | sh scripts/connect.sh "umask 077; mkdir -p /root/vision-bascule-preparations/$GITHUB_SHA/source; tar --no-same-permissions -xf - -C /root/vision-bascule-preparations/$GITHUB_SHA/source"
      - name: Réparer la seule référence qualifiée puis vérifier les restaurations et l’association isolées
        if: ${{ !inputs.sauvegarde-telephone && !inputs.preparer-essai }}
        run: |
          sh scripts/connect.sh "nix-shell -I nixpkgs=/nix/store/81s59zcy998ym4b36ayr29cjc9yhma5n-nixos-26.05.8639.c5c4a43b0e80/nixos -p python3 --run 'python3 /root/vision-bascule-preparations/$GITHUB_SHA/source/scripts/vision-bascule-preparer.py $GITHUB_SHA'"
      - name: Restaurer les copies, chiffrer pour le téléphone et remettre au relais existant
        if: ${{ inputs.sauvegarde-telephone }}
        run: |
          sh scripts/connect.sh "nix-shell -I nixpkgs=/nix/store/81s59zcy998ym4b36ayr29cjc9yhma5n-nixos-26.05.8639.c5c4a43b0e80/nixos -p python3 --run 'python3 /root/vision-bascule-preparations/$GITHUB_SHA/source/scripts/vision-bascule-preparer.py $GITHUB_SHA --sauvegarde-telephone'"
      - name: Qualifier la génération complète et préparer son retour sans activer
        if: ${{ inputs.preparer-essai && !inputs.sauvegarde-telephone }}
        run: |
          sh scripts/connect.sh "nix-shell -I nixpkgs=/nix/store/81s59zcy998ym4b36ayr29cjc9yhma5n-nixos-26.05.8639.c5c4a43b0e80/nixos -p python3 --run 'python3 /root/vision-bascule-preparations/$GITHUB_SHA/source/scripts/vision-bascule-preparer.py $GITHUB_SHA --essai'"
      - name: Vérifier une nouvelle connexion et les six services
        if: ${{ always() && steps.sites.outcome == 'success' }}
        run: sh scripts/connect.sh systemctl is-active sshd nginx postgresql vision matheval mrj-auth
      - name: Vérifier les 25 sites même après un refus
        if: ${{ always() && steps.sites.outcome == 'success' }}
        run: python3 scripts/probe.py --baseline "$RUNNER_TEMP/http-before.json"
      - name: Effacer la clé du runner
        if: always()
        run: rm -f -- "$RUNNER_TEMP/vision-bascule-admin"
