name: ViSe — service autonome
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Lecture des préconditions du service autonome
        type: choice
        options: [diagnostic, apply]
        default: diagnostic
permissions:
  contents: read
concurrency:
  group: vps-administration
  cancel-in-progress: false
jobs:
  vise:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: vps-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Préparer la clé d'exploitation existante
        env:
          SSH_KEY: ${{ secrets.VPS_ADMIN_SSH_KEY }}
        run: |
          set -eu
          test -n "$SSH_KEY"
          umask 077
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/vise-cle"
          printf 'VPS_SSH_KEY=%s\n' "$RUNNER_TEMP/vise-cle" >> "$GITHUB_ENV"
      - name: Diagnostic sans mutation ni donnée métier
        if: inputs.operation == 'diagnostic'
        run: |
          set -eu
          sh scripts/connect.sh "nix-shell -I nixpkgs=/nix/store/81s59zcy998ym4b36ayr29cjc9yhma5n-nixos-26.05.8639.c5c4a43b0e80/nixos -p python3 --run 'python3 -'" < scripts/vise-diagnostic.py > vise-diagnostic.json
          python3 -m json.tool vise-diagnostic.json
      - name: Lire le candidat portable figé
        if: inputs.operation == 'apply'
        id: target
        run: echo "revision=$(python3 -c 'import json; print(json.load(open("assemblage/vise/target.json"))["sourceRevision"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: inputs.operation == 'apply'
        with:
          repository: MrJ-am/etp-vie-affective
          ref: ${{ steps.target.outputs.revision }}
          path: vise-source
          persist-credentials: false
      - name: Promouvoir l'artefact exact avec sauvegarde et retour autonome
        if: inputs.operation == 'apply'
        env:
          DELIVERY: /root/vise-delivery/${{ github.sha }}-${{ github.run_id }}
        run: |
          set -eu
          cp vise-source/deployment/artifacts/vise-portable.tar.gz vise-portable.tar.gz
          python3 - <<'PY'
          import hashlib,json
          expected=json.load(open('assemblage/vise/target.json'))['sha256']
          assert hashlib.sha256(open('vise-portable.tar.gz','rb').read()).hexdigest()==expected
          PY
          tar -czf - assemblage/vise scripts/vise-promote.py scripts/monolithe-sauvegarde.py vise-portable.tar.gz | sh scripts/connect.sh "umask 077; test ! -e $DELIVERY; mkdir -p $DELIVERY; tar -xzf - -C $DELIVERY"
          sh scripts/connect.sh "nix-shell -I nixpkgs=/nix/store/81s59zcy998ym4b36ayr29cjc9yhma5n-nixos-26.05.8639.c5c4a43b0e80/nixos -p python3 --run 'python3 $DELIVERY/scripts/vise-promote.py'"
      - uses: actions/upload-artifact@v4
        if: inputs.operation == 'diagnostic'
        with:
          name: vise-diagnostic
          path: vise-diagnostic.json
          retention-days: 7
      - name: Retirer la clé éphémère
        if: always()
        run: rm -f -- "$RUNNER_TEMP/vise-cle"
