# Catégories constantes : jamais de texte fourni par le client dans une URL,
# un en-tête, un corps ou un identifiant de fiche. request_uri garde la route
# initiale, même après redirection interne vers une erreur JSON.
map $request_uri $http_route_journal {
    default "autre";
    ~^/mcp(?:\?|$) "mcp";
    ~^/auth/ "auth";
    ~^/api/web/ "api-web";
    ~^/api/ "api";
    ~^/matheval/ "matheval";
    ~^/(?:assets|katex)/ "ressource";
    ~^/(?:\?|$) "accueil";
}
map $request_method $http_methode_journal {
    default "AUTRE";
    GET GET; HEAD HEAD; POST POST; PUT PUT; PATCH PATCH;
    DELETE DELETE; OPTIONS OPTIONS;
}
log_format http_prive escape=json
    '{"date":"$time_iso8601","id":"$request_id",'
    '"ip":"$remote_addr","site":"$server_name",'
    '"methode":"$http_methode_journal","route":"$http_route_journal",'
    '"statut":$status,"octets":$bytes_sent,"duree":$request_time,'
    '"amont":"$upstream_status","duree_amont":"$upstream_response_time",'
    '"limite_debit":"$limit_req_status","limite_connexions":"$limit_conn_status"}';
access_log syslog:server=unix:/dev/log,facility=local6,tag=http_acces,severity=info,nohostname http_prive;
