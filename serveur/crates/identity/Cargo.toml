[package]
name = "mrjam-identity"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
axum.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
http-body-util.workspace = true
hyper = { version = "=1.12.0", features = ["client", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
ring = "=0.17.14"
base64 = "=0.22.1"
subtle = "=2.6.1"
url = "=2.5.8"
sqlx = { version = "=0.9.0", default-features = false, features = ["sqlite", "postgres", "runtime-tokio", "json"] }
libc = "=0.2.191"
rustix = { version = "=1.1.2", default-features = false, features = ["fs", "std"] }

[lints]
workspace = true
