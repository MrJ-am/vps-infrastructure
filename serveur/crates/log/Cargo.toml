[package]
name = "mrjam-log"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
integration-tls = []

[[test]]
name = "tls_network"
required-features = ["integration-tls"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
http-body-util.workspace = true
hyper = { version = "=1.12.0", features = ["client", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
url = "=2.5.8"
sqlx = { version = "=0.9.0", default-features = false, features = ["sqlite", "runtime-tokio"] }

[lints]
workspace = true
