[workspace]
members = ["crates/server", "crates/audition", "crates/log", "crates/identity", "crates/identity-deletion", "components/vision", "components/mateval"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[workspace.dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync", "io-util"] }
tower = { version = "=0.5.3", features = ["util", "limit"] }
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
rmcp = { version = "=3.8.0", default-features = false, features = ["server"] }
http-body-util = "=0.1.5"
mrjam-vision = { path = "components/vision" }
mrjam-mateval = { path = "components/mateval" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
